<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Browser window on nodejs.org with a Download Node.js LTS button">
  <!-- background -->
  <rect width="480" height="240" rx="20" fill="#F4F8F9"/>

  <!-- soft shadow plate -->
  <rect x="44" y="40" width="392" height="168" rx="16" fill="#0D2A2B" opacity="0.06"/>

  <!-- browser window -->
  <rect x="40" y="34" width="392" height="168" rx="16" fill="#FFFFFF" stroke="#E2EAEC" stroke-width="2"/>

  <!-- chrome bar -->
  <path d="M40 50 a16 16 0 0 1 16 -16 h360 a16 16 0 0 1 16 16 v22 h-392 z" fill="#EEF3F4"/>
  <!-- 3 dots -->
  <circle cx="64" cy="50" r="5" fill="#FF6259"/>
  <circle cx="82" cy="50" r="5" fill="#FFB52E"/>
  <circle cx="100" cy="50" r="5" fill="#28C76F"/>
  <!-- address pill -->
  <rect x="124" y="40" width="280" height="20" rx="10" fill="#FFFFFF" stroke="#D7E2E4" stroke-width="1.5"/>
  <!-- lock glyph -->
  <rect x="136" y="46" width="8" height="7" rx="1.5" fill="#9FB3B6"/>
  <path d="M139.5 46 v-2 a1.5 1.5 0 0 1 3 0 v2" fill="none" stroke="#9FB3B6" stroke-width="1.4"/>
  <text x="152" y="54" font-size="11" fill="#5C7174">nodejs.org</text>

  <!-- page content -->
  <!-- node hexagon emblem -->
  <path d="M236 92 l16 9 v18 l-16 9 -16 -9 v-18 z" fill="#3C873A"/>
  <path d="M236 100 l9 5 v10 l-9 5 -9 -5 v-10 z" fill="#FFFFFF" opacity="0.85"/>

  <!-- big download button -->
  <rect x="118" y="146" width="244" height="40" rx="20" fill="#3C873A"/>
  <rect x="118" y="146" width="244" height="40" rx="20" fill="#FFFFFF" opacity="0.08"/>
  <!-- download arrow icon -->
  <g stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M150 158 v12"/>
    <path d="M145 165 l5 5 5 -5"/>
    <path d="M144 174 h12"/>
  </g>
  <text x="172" y="171" font-size="14" font-weight="600" fill="#FFFFFF">Download Node.js (LTS)</text>

  <!-- caption -->
  <text x="240" y="198" font-size="11" fill="#7A8E91" text-anchor="middle">for Windows</text>

  <!-- subtle teal accent dot -->
  <circle cx="406" cy="190" r="4" fill="#00ABAF"/>
</svg>
