<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Command Prompt window running npm install of the Claude Code package">
  <!-- background -->
  <rect width="480" height="240" rx="20" fill="#F4F8F9"/>

  <!-- soft shadow plate -->
  <rect x="44" y="40" width="392" height="168" rx="16" fill="#0D2A2B" opacity="0.10"/>

  <!-- terminal window -->
  <rect x="40" y="34" width="392" height="168" rx="16" fill="#16242B"/>

  <!-- title bar -->
  <path d="M40 50 a16 16 0 0 1 16 -16 h360 a16 16 0 0 1 16 16 v22 h-392 z" fill="#1F333C"/>
  <!-- 3 dots -->
  <circle cx="64" cy="50" r="5" fill="#FF6259"/>
  <circle cx="82" cy="50" r="5" fill="#FFB52E"/>
  <circle cx="100" cy="50" r="5" fill="#28C76F"/>
  <!-- title -->
  <text x="240" y="54" font-size="11.5" fill="#9DB2BB" text-anchor="middle">Command Prompt</text>

  <!-- terminal body lines -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
    <!-- info line -->
    <text x="64" y="104" font-size="11" fill="#5E7884">Microsoft Windows [Version 10.0]</text>

    <!-- prompt + command -->
    <text x="64" y="138" font-size="12.5" fill="#00ABAF">C:\&gt;</text>
    <text x="92" y="138" font-size="12.5" fill="#E6F0F2" font-weight="600">npm install -g @anthropic-ai/claude-code</text>

    <!-- next prompt line with cursor -->
    <text x="64" y="166" font-size="12.5" fill="#00ABAF">C:\&gt;</text>
  </g>
  <!-- blinking cursor block -->
  <rect x="92" y="156" width="9" height="14" rx="1.5" fill="#00ABAF">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
