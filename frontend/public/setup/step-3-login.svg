<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Running claude in a terminal opens a browser to log in to Claude">
  <!-- background -->
  <rect width="480" height="240" rx="20" fill="#F4F8F9"/>

  <!-- ===== left: small terminal ===== -->
  <rect x="32" y="74" width="170" height="92" rx="14" fill="#0D2A2B" opacity="0.10"/>
  <rect x="28" y="68" width="170" height="92" rx="14" fill="#16242B"/>
  <!-- title bar -->
  <path d="M28 82 a14 14 0 0 1 14 -14 h142 a14 14 0 0 1 14 14 v16 h-170 z" fill="#1F333C"/>
  <circle cx="46" cy="82" r="4" fill="#FF6259"/>
  <circle cx="60" cy="82" r="4" fill="#FFB52E"/>
  <circle cx="74" cy="82" r="4" fill="#28C76F"/>
  <!-- command -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
    <text x="44" y="126" font-size="13" fill="#00ABAF">$</text>
    <text x="58" y="126" font-size="13" fill="#E6F0F2" font-weight="600">claude</text>
  </g>
  <rect x="108" y="116" width="8" height="13" rx="1.5" fill="#00ABAF">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== arrow ===== -->
  <g stroke="#00ABAF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M208 114 h44"/>
    <path d="M244 105 l10 9 -10 9"/>
  </g>

  <!-- ===== right: browser login card ===== -->
  <rect x="268" y="46" width="184" height="152" rx="16" fill="#0D2A2B" opacity="0.06"/>
  <rect x="264" y="40" width="184" height="152" rx="16" fill="#FFFFFF" stroke="#E2EAEC" stroke-width="2"/>
  <!-- chrome bar -->
  <path d="M264 56 a16 16 0 0 1 16 -16 h152 a16 16 0 0 1 16 16 v16 h-184 z" fill="#EEF3F4"/>
  <circle cx="282" cy="56" r="4" fill="#FF6259"/>
  <circle cx="296" cy="56" r="4" fill="#FFB52E"/>
  <circle cx="310" cy="56" r="4" fill="#28C76F"/>

  <!-- Claude mark -->
  <circle cx="356" cy="98" r="20" fill="#FBEFE6"/>
  <path d="M356 86 l4 8 8 4 -8 4 -4 8 -4 -8 -8 -4 8 -4 z" fill="#D97757"/>

  <!-- title -->
  <text x="356" y="138" font-size="13" font-weight="600" fill="#1F333C" text-anchor="middle">Log in to Claude</text>

  <!-- Continue button -->
  <rect x="292" y="152" width="128" height="32" rx="16" fill="#00ABAF"/>
  <text x="356" y="172" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Continue</text>
</svg>
