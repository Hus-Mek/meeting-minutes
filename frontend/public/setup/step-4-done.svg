<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Success state: a teal check mark with the message You're all set">
  <!-- background -->
  <rect width="480" height="240" rx="20" fill="#F4F8F9"/>

  <!-- decorative soft rings behind the check -->
  <circle cx="240" cy="98" r="62" fill="#00ABAF" opacity="0.08"/>
  <circle cx="240" cy="98" r="48" fill="#00ABAF" opacity="0.12"/>

  <!-- success circle -->
  <circle cx="240" cy="98" r="36" fill="#0D2A2B" opacity="0.10"/>
  <circle cx="240" cy="96" r="36" fill="#00ABAF"/>
  <!-- white checkmark -->
  <path d="M224 97 l11 11 21 -23" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- tiny document motif (left) -->
  <g transform="translate(150 70)">
    <rect x="0" y="0" width="34" height="44" rx="5" fill="#FFFFFF" stroke="#D7E2E4" stroke-width="2"/>
    <path d="M24 0 v10 h10" fill="#EEF3F4"/>
    <line x1="8" y1="20" x2="26" y2="20" stroke="#00ABAF" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="8" y1="28" x2="26" y2="28" stroke="#C3D3D6" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="8" y1="36" x2="19" y2="36" stroke="#C3D3D6" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- sparkles (right) -->
  <g fill="#00ABAF">
    <path d="M312 64 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
    <path d="M338 96 l2 4.5 4.5 2 -4.5 2 -2 4.5 -2 -4.5 -4.5 -2 4.5 -2 z" opacity="0.7"/>
  </g>
  <circle cx="300" cy="104" r="3" fill="#FFB52E"/>

  <!-- headline -->
  <text x="240" y="186" font-size="22" font-weight="700" fill="#16242B" text-anchor="middle">You're all set!</text>
  <!-- subline -->
  <text x="240" y="210" font-size="12" fill="#7A8E91" text-anchor="middle">Claude Code is ready to use</text>
</svg>
