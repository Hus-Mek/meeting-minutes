# Builds the one-click Windows installer (MeetingMinutes-Setup.exe) on a
# Windows runner. Runs manually (workflow_dispatch) or automatically when a
# version tag (v*) is pushed; on a tag it also attaches the installer to the
# matching GitHub Release.
name: build-windows

# Manual runs from the Actions tab, plus automatic runs on version tags.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Needed so the release step can create/update a Release and upload assets.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # Map the (optional) code-signing secrets to env so the signing steps can be
    # gated on `env.WINDOWS_PFX_BASE64 != ''`. When the secrets are unset the
    # signing steps are skipped and the build still produces an (unsigned) installer.
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}

    steps:
      # 1. Get the source.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Toolchains: Node (frontend build) and Python (backend + freeze).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Build the React SPA -> frontend/dist (bundled by the PyInstaller spec).
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 4. Install Python runtime deps + the desktop extras + PyInstaller.
      #    PyInstaller is a build-only tool, so it is installed here rather than
      #    listed in requirements-desktop.txt.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt pyinstaller

      # 5. Pre-build the .docx template at packaging time so the frozen app
      #    never has to write into read-only Program Files at runtime.
      - name: Pre-build .docx template
        run: python -c "from meeting_minutes.sample_template import build; print(build())"

      # 6. Generate the app icon (packaging/app.ico) used by the EXE + installer.
      - name: Generate app icon
        run: python packaging/make_icon.py

      # 6b. Vendor a portable Node.js + the Claude Code CLI into vendor/node so the
      #     installer ships everything the app needs except a one-time Claude login.
      #     (The launcher prefers a claude the user already has and falls back to this.)
      - name: Vendor Node.js + Claude Code CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "v20.18.1"
          $url = "https://nodejs.org/dist/$ver/node-$ver-win-x64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node_tmp -Force
          if (Test-Path vendor/node) { Remove-Item -Recurse -Force vendor/node }
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Move-Item "node_tmp/node-$ver-win-x64" vendor/node
          $prefix = (Resolve-Path vendor/node).Path
          & "vendor/node/npm.cmd" install -g "@anthropic-ai/claude-code" --prefix "$prefix"
          if (-not (Test-Path vendor/node/claude.cmd)) { throw "claude.cmd missing after npm install" }
          Write-Host "Vendored Node + Claude Code CLI OK:"
          Get-ChildItem vendor/node/claude.cmd

      # 7. Freeze the app into dist/MeetingMinutes/ (ONEDIR: MeetingMinutes.exe + _internal/).
      - name: Freeze with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/meeting_minutes.spec

      # 7b. Sign the app EXE BEFORE the installer is built, so the installer ships a
      #     signed binary. Gated: runs only when the WINDOWS_PFX_* secrets are set.
      - name: Sign app executable
        if: env.WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        run: pwsh packaging/sign_windows.ps1 -Path "dist/MeetingMinutes/MeetingMinutes.exe"

      # 8. Install Inno Setup 6 (provides ISCC.exe) via Chocolatey.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # 9. Compile the installer -> dist/installer/MeetingMinutes-Setup.exe.
      #    ISCC lives at a path with spaces, so invoke it with the PowerShell
      #    call operator (&) and a quoted path.
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/installer.iss'

      # 9b. Sign the finished installer. Gated on the WINDOWS_PFX_* secrets.
      - name: Sign installer
        if: env.WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        run: pwsh packaging/sign_windows.ps1 -Path "dist/installer/MeetingMinutes-Setup.exe"

      # 10. Always upload the installer as a workflow artifact.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetingMinutes-Setup
          path: dist/installer/MeetingMinutes-Setup.exe

      # 11. On tag pushes only, attach the installer to the GitHub Release.
      - name: Attach installer to release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/MeetingMinutes-Setup.exe
